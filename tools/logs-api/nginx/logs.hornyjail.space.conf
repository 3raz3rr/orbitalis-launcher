# HTTP → HTTPS
server {
    listen 80;
    server_name logs.hornyjail.space;

    return 301 https://$host$request_uri;
}

# Основной HTTPS-сайт для логов
server {
    listen 443 ssl http2;
    server_name logs.hornyjail.space;

    ssl_certificate     /etc/letsencrypt/live/logs.hornyjail.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.hornyjail.space/privkey.pem;

    root /var/www/logs;
    index index.php index.html index.htm;

    access_log /var/log/nginx/logs_access.log;
    error_log  /var/log/nginx/logs_error.log;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        client_max_body_size 4m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8788/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
